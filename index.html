<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prism Pop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%2732 4 60 32 32 60 4 32z%27 fill=%27%234d8dff%27/%3E%3Cpath d=%2732 4 60 32 32 32z%27 fill=%27%23a9ccff%27/%3E%3C/svg%3E">
<meta name="description" content="Match three gems, make specials, clear jelly, bring down keys. Twenty levels.">
<meta name="theme-color" content="#07061c">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07061c; overscroll-behavior: none; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; }
  .bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, #3b1d9a 0%, #1a0f5c 40%, #07061c 100%); overflow: hidden; }
  .bg::before, .bg::after { content: ""; position: absolute; width: 140vmax; height: 140vmax; left: -20vmax; top: -40vmax; border-radius: 50%; will-change: transform; }
  .bg::before { background: radial-gradient(circle at 30% 40%, rgba(255, 47, 176, .55) 0%, rgba(255, 47, 176, 0) 32%), radial-gradient(circle at 70% 60%, rgba(25, 240, 255, .45) 0%, rgba(25, 240, 255, 0) 30%); animation: drift 26s ease-in-out infinite alternate; }
  .bg::after { background: radial-gradient(circle at 60% 30%, rgba(255, 196, 0, .35) 0%, rgba(255, 196, 0, 0) 26%), radial-gradient(circle at 25% 75%, rgba(150, 60, 255, .5) 0%, rgba(150, 60, 255, 0) 34%); animation: drift 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(-6%, -4%) rotate(0deg) scale(1); } to { transform: translate(8%, 10%) rotate(40deg) scale(1.15); } }
  .bg i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: tw 2.4s infinite alternate; }
  @keyframes tw { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.3); } }

  /* ---------- map ---------- */
  #map { overflow-y: auto; overflow-x: hidden; padding: 0 0 60px; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 18px 10px; background: linear-gradient(#07061c 40%, rgba(7, 6, 28, 0)); }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: -.03em; text-shadow: 0 3px 0 #4a0c8c, 0 8px 24px rgba(0, 0, 0, .5); }
  .logo span { color: #19f0ff; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(#3a2a9e, #1e1460); border: 2px solid #ff2fb0; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 900; box-shadow: 0 3px 0 #0d0930; }
  .pill + .pill { border-color: #ffd200; box-shadow: 0 3px 0 #0d0930; }
  .path { position: relative; width: min(420px, 100%); margin: 10px auto 0; }
  .path svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); background: radial-gradient(circle at 35% 30%, #ffa3e0, #ff2fb0 55%, #9a0a66); box-shadow: 0 7px 0 #6a0747, 0 14px 28px rgba(0, 0, 0, .5), inset 0 -4px 0 rgba(0, 0, 0, .15); cursor: pointer; transition: transform .12s; animation: nodeIn .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--d, 0s); }
  @keyframes nodeIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .node:active { transform: translateY(3px); }
  .node.locked { background: radial-gradient(circle at 35% 30%, #9a7dff, #5a3ad8 55%, #2a1a7a); box-shadow: 0 7px 0 #170f4a, 0 10px 20px rgba(0, 0, 0, .4); border: 3px solid rgba(255, 255, 255, .35); cursor: default; }
  .node.locked::before { content: "🔒"; position: absolute; top: -10px; right: -8px; font-size: 18px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .6)); }
  .node.done { background: radial-gradient(circle at 35% 30%, #a8ffd6, #19e07f 55%, #0a8a4a); box-shadow: 0 7px 0 #06603a, 0 14px 28px rgba(0, 0, 0, .5); }
  .node.current { animation: nodeIn .5s cubic-bezier(.2, 1.4, .4, 1) both, pulse 1.2s .5s infinite; }
  .node.current::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #ffd200; animation: halo 1.2s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes halo { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  .node .stars { position: absolute; bottom: -16px; font-size: 15px; letter-spacing: -2px; color: #ffd200; text-shadow: 0 2px 0 #7a4a00; }

  /* ---------- game ---------- */
  #game { display: flex; flex-direction: column; }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 14px 8px; }
  .hud .box { flex: 0 1 auto; background: rgba(5, 4, 30, .7); border: 2px solid rgba(255, 255, 255, .28); border-radius: 16px; padding: 6px 12px; text-align: center; min-width: 78px; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  .hud .box small { display: block; font-size: 11px; font-weight: 900; color: #19f0ff; text-transform: uppercase; letter-spacing: .08em; }
  .hud .box b { display: inline-block; font-size: clamp(17px, 5vw, 23px); font-weight: 900; line-height: 1.1; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
  .hud .box.score small { color: #ffd200; }
  .hud .goal { display: flex; gap: 10px; align-items: center; border-color: #ff2fb0; }
  .hud .goal small { color: #ff7ad0; }
  .hud .goal b { font-size: clamp(15px, 4.4vw, 19px); }
  .bump { animation: bump .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #ffd200; } 100% { transform: scale(1); } }
  @media (max-width: 560px) { .hud { padding-left: 8px; padding-right: 8px; gap: 5px; } .hud .box { min-width: 0; padding: 5px 8px; } .back { padding: 8px 10px; } .back .lbl { display: none; } .hud .goal { gap: 6px; } .hud .goal span { font-size: 18px !important; } }
  .bar { height: 12px; margin: 0 14px; border-radius: 999px; background: rgba(0, 0, 0, .6); overflow: hidden; position: relative; border: 2px solid rgba(255, 255, 255, .25); }
  .bar i { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #19f0ff, #b25dff, #ff2fb0, #ffd200); background-size: 300% 100%; animation: shimmer 2.4s linear infinite; transition: width .5s cubic-bezier(.2, .8, .2, 1); border-radius: 999px; }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 300% 0; } }
  .bar s { position: absolute; top: -3px; width: 3px; height: 16px; background: #ffd200; }
  #boardWrap { flex: 1; display: grid; place-items: center; padding: 8px; min-height: 0; }
  #c { display: block; touch-action: none; border-radius: 16px; background: #05040f; box-shadow: 0 0 0 3px rgba(255, 255, 255, .3), 0 24px 50px rgba(0, 0, 0, .6); }
  .boosters { display: flex; justify-content: center; gap: 12px; padding: 8px 0 max(14px, env(safe-area-inset-bottom)); }
  .boost { position: relative; width: 60px; height: 60px; border-radius: 18px; border: 2.5px solid rgba(255, 255, 255, .4); background: linear-gradient(#3a2a8a, #1e1552); display: grid; place-items: center; font-size: 28px; cursor: pointer; box-shadow: 0 5px 0 #0d0930, 0 10px 20px rgba(0, 0, 0, .4); transition: transform .12s; }
  .boost svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
  .boost:active { transform: translateY(3px); box-shadow: 0 2px 0 #0d0930; }
  .boost.on { border-color: #ffd200; background: linear-gradient(#ffb300, #ff7a00); box-shadow: 0 5px 0 #8a3d00; animation: pulse .8s infinite; }
  .boost.empty { opacity: .45; filter: saturate(.3); }
  .boost u { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; background: #ff2d55; border: 2px solid #fff; font: 900 12px/20px sans-serif; text-align: center; text-decoration: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .back { border: 0; white-space: nowrap; font: inherit; font-weight: 900; color: #06203a; background: linear-gradient(#9cf4ff, #19c8ff); border: 2px solid #fff; padding: 8px 12px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #0a6a9a; }
  .back:active { transform: translateY(2px); box-shadow: 0 2px 0 #0a6a9a; }
  .back.pause { background: linear-gradient(#ff8fd0, #ff2fb0); color: #fff; box-shadow: 0 4px 0 #8a0a5a; font-size: 18px; line-height: 1; padding: 7px 11px; }
  .back.pause:active { box-shadow: 0 2px 0 #8a0a5a; }
  .back.snd { background: linear-gradient(#a6ffbe, #22e65a); color: #053d1c; box-shadow: 0 4px 0 #047a2c; font-size: 16px; line-height: 1; padding: 8px 10px; }
  .back.snd:active { box-shadow: 0 2px 0 #047a2c; }

  /* ---------- overlays ---------- */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(4, 3, 18, .78); z-index: 10; padding: 16px; animation: fade .25s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { width: min(360px, 100%); background: linear-gradient(160deg, #3b2a9e, #1a124a 70%); border: 3px solid rgba(255, 255, 255, .3); border-radius: 26px; padding: 26px 24px; text-align: center; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); animation: cardIn .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes cardIn { from { transform: scale(.6) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 3px 0 #4a0c8c; }
  .card p { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .card .big { font-size: 50px; margin: 6px 0 10px; letter-spacing: -2px; }
  .card .big b { color: #ffd200; text-shadow: 0 3px 0 #9a5b00; }
  .card .big b i { display: inline-block; font-style: normal; animation: starIn .6s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d, 0s); }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .card .big s { color: rgba(255, 255, 255, .3); text-decoration: none; }
  .btn { border: 0; font: inherit; font-size: 18px; font-weight: 900; color: #2a1200; background: linear-gradient(#ffe259, #ffa700); padding: 14px 24px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #a85d00, 0 10px 20px rgba(0, 0, 0, .4); margin: 4px; transition: transform .1s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a85d00; }
  .btn.ghost { background: linear-gradient(#5a46c8, #3a2a9e); color: #fff; box-shadow: 0 5px 0 #1a1050, 0 10px 20px rgba(0, 0, 0, .4); }
  .goalrow { display: flex; justify-content: center; gap: 12px; margin: 10px 0 18px; font-weight: 900; font-size: 18px; }
  .goalrow div { background: rgba(0, 0, 0, .4); border: 2px solid rgba(255, 255, 255, .2); border-radius: 14px; padding: 10px 14px; }
  .goalrow div small { display: block; font-size: 11px; color: #19f0ff; text-transform: uppercase; letter-spacing: .06em; }
  .toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.4); font-size: clamp(40px, 9vw, 68px); font-weight: 900; letter-spacing: -.03em; color: #fff; -webkit-text-stroke: 2px #4a0c8c; paint-order: stroke fill; text-shadow: 0 6px 0 #4a0c8c, 0 14px 40px rgba(0, 0, 0, .7); pointer-events: none; opacity: 0; z-index: 9; white-space: nowrap; }
  .toast.show { animation: toastIn 1.1s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(2deg); } 30% { transform: translate(-50%, -50%) scale(1) rotate(0); } 75% { opacity: 1; transform: translate(-50%, -52%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1.1); } }
  .fly { position: fixed; z-index: 8; font-size: 30px; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<section class="screen" id="map">
  <div class="top">
    <div class="logo">Prism <span>Pop</span></div>
    <div style="display:flex;gap:8px"><span class="pill">❤️ <span id="lives">5</span></span><span class="pill">⭐ <span id="starsTotal">0</span></span><span class="pill snd" style="border-color:#22e65a;cursor:pointer">🔊</span><a class="pill" href="../games/" style="color:#fff;text-decoration:none;border-color:#19f0ff;box-shadow:0 3px 0 #0d0930">🎮</a></div>
  </div>
  <div class="path" id="path"><svg id="pathSvg" viewBox="0 0 420 1400" preserveAspectRatio="none"></svg></div>
</section>

<section class="screen" id="game" hidden>
  <div class="hud">
    <button class="back" id="btnBack">‹<span class="lbl"> Map</span></button>
    <button class="back pause" id="btnPause" title="Pause">⏸</button>
    <button class="back snd" id="btnSound" title="Sound">🔊</button>
    <div class="box"><small>Moves</small><b id="moves">0</b></div>
    <div class="box goal" id="goalBox"></div>
    <div class="box score"><small>Score</small><b id="score">0</b></div>
  </div>
  <div class="bar"><i id="barFill"></i><s style="left:33%"></s><s style="left:66%"></s></div>
  <div id="boardWrap"><canvas id="c"></canvas></div>
  <div class="boosters">
    <div class="boost" data-b="hammer" title="Hammer: remove any gem"><svg viewBox="0 0 48 48"><defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><path d="M27 20 L13 40 a3.5 3.5 0 0 1 -6 -4 L21 16 Z" fill="#ffb000" stroke="#7a3a00" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 12 l10 -6 l14 10 l-6 9 l-6 -4 l-5 3 z" fill="url(#gh)" stroke="#0a2fa8" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 9 l12 9" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/><path d="M40 4 l3 -3 M43 11 l4 -1 M36 2 l1 -1" stroke="#ffd200" stroke-width="3" stroke-linecap="round"/></svg><u id="nHammer">0</u></div>
    <div class="boost" data-b="moves" title="+5 moves"><svg viewBox="0 0 48 48"><defs><radialGradient id="gp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a6ffbe"/><stop offset="1" stop-color="#0a9a3b"/></radialGradient></defs><circle cx="24" cy="24" r="19" fill="url(#gp)" stroke="#047a2c" stroke-width="2.5"/><path d="M24 13 v22 M13 24 h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="36" y="44" font-size="13" font-weight="900" fill="#ffd200" stroke="#7a4a00" stroke-width=".8" font-family="system-ui">5</text></svg><u id="nMoves">0</u></div>
    <div class="boost" data-b="switch" title="Free switch: swap any two neighbours"><svg viewBox="0 0 48 48"><defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fd0"/><stop offset="1" stop-color="#c81cff"/></linearGradient></defs><path d="M8 17 h22 l-6 -7 M30 17 l-6 7" fill="none" stroke="url(#gs)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 31 h-22 l6 -7 M18 31 l6 7" fill="none" stroke="#19f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><u id="nSwitch">0</u></div>
  </div>
</section>

<div class="modal" id="mStart" hidden><div class="card">
  <h2 id="sTitle">Level 1</h2><p id="sGoal"></p>
  <div class="goalrow" id="sRow"></div>
  <button class="btn" id="sCont" hidden>▶ Continue</button>
  <button class="btn" id="sPlay">Play</button>
</div></div>
<div class="modal" id="mPause" hidden><div class="card">
  <h2>Paused</h2><p>Your board is saved. Come back any time.</p>
  <button class="btn" id="pResume">▶ Resume</button>
  <button class="btn ghost" id="pMap">Map</button>
  <button class="btn ghost snd" type="button">🔊 Sound</button>
  <a class="btn ghost" href="../games/" style="display:inline-block;text-decoration:none">🎮 All games</a>
</div></div>
<div class="modal" id="mEnd" hidden><div class="card">
  <h2 id="eTitle">Level complete</h2>
  <div class="big" id="eStars"></div>
  <p id="eText"></p>
  <div id="eBtns"></div>
  <a class="btn ghost" href="../games/" style="display:inline-block;text-decoration:none">🎮 All games</a>
</div></div>
<div class="modal" id="mLives" hidden><div class="card">
  <h2>Out of lives</h2><p id="lifeText">A new life arrives in a while.</p>
  <button class="btn ghost" id="lifeClose">OK</button>
  <a class="btn ghost" href="../games/" style="display:inline-block;text-decoration:none">🎮 All games</a>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ================================================================ config
const COLS = 9, ROWS = 9, NCOL = 6;
const COLORS = [
  { name: "ruby", c: "#ff2d55", l: "#ff8fa8", d: "#a3001f", shape: "drop" },
  { name: "amber", c: "#ffb000", l: "#ffe08a", d: "#b35400", shape: "hex" },
  { name: "emerald", c: "#22e65a", l: "#a6ffbe", d: "#047a2c", shape: "square" },
  { name: "sapphire", c: "#2f7bff", l: "#9cc2ff", d: "#0a2fa8", shape: "diamond" },
  { name: "amethyst", c: "#c13dff", l: "#e6aaff", d: "#6a05b3", shape: "round" },
  { name: "aqua", c: "#19f0ff", l: "#aefaff", d: "#0583a3", shape: "tri" }
];
const rnd = (n) => Math.floor(Math.random() * n);
const sleep = (ms) => new Promise(r => setTimeout(r, window.__fast ? 0 : ms));
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- levels
// mask rows: '#' hole, '.' plain, 'j' jelly, 'J' double jelly, 'f' frost1, 'F' frost2, 'G' frost3, 'l' lock, 'c' chocolate, 'x' ingredient exit (bottom)
const M = {
  full: null,
  cross: ["##.....##", "##.....##", ".........", ".........", ".........", ".........", ".........", "##.....##", "##.....##"],
  ring: [".........", ".........", "..#####..", "..#...#..", "..#...#..", "..#...#..", "..#####..", ".........", "........."],
  diamond: ["####.####", "###...###", "##.....##", "#.......#", ".........", "#.......#", "##.....##", "###...###", "####.####"],
  heart: ["##.###.##", "#...#...#", ".........", ".........", "#.......#", "##.....##", "###...###", "####.####", "#########"]
};
const LEVELS = [
  { goal: "score", target: 2500, moves: 20, colors: 5 },
  { goal: "score", target: 3000, moves: 20, colors: 5, mask: M.cross },
  { goal: "jelly", moves: 24, colors: 5, jelly: ["#########", "#########", "#########", "#########", "#########", "#########", "#########", "jjjjjjjjj", "jjjjjjjjj"].map(r => r.replace(/#/g, ".")) },
  { goal: "score", target: 6000, moves: 22, colors: 6 },
  { goal: "jelly", moves: 26, colors: 5, jelly: ["jjj...jjj", "jjj...jjj", "jjj...jjj", ".........", ".........", ".........", "jjj...jjj", "jjj...jjj", "jjj...jjj"] },
  { goal: "ingredients", need: 2, moves: 25, colors: 5 },
  { goal: "blockers", moves: 28, colors: 5, layout: [".........", ".........", "..fffff..", "..f...f..", "..f...f..", "..f...f..", "..fffff..", ".........", "........."] },
  { goal: "jelly", moves: 44, colors: 6, mask: M.ring, jelly: ["jjjjjjjjj", "jjjjjjjjj", "jj.....jj", "jj.....jj", "jj.....jj", "jj.....jj", "jj.....jj", "jjjjjjjjj", "jjjjjjjjj"] },
  { goal: "score", target: 9000, moves: 25, colors: 6, mask: M.diamond },
  { goal: "ingredients", need: 3, moves: 30, colors: 5, layout: [".........", ".........", ".........", ".........", "..lll.lll", ".........", ".........", ".........", "........."] },
  { goal: "blockers", moves: 30, colors: 5, layout: ["c........", ".........", ".........", "....F....", "...FGF...", "....F....", ".........", ".........", "........c"] },
  { goal: "jelly", moves: 40, colors: 6, jelly: ["JJJJJJJJJ", "J.......J", "J.......J", "J.......J", "J.......J", "J.......J", "J.......J", "J.......J", "JJJJJJJJJ"] },
  { goal: "score", target: 18000, moves: 26, colors: 6, layout: [".........", ".l.l.l.l.", ".........", ".l.l.l.l.", ".........", ".l.l.l.l.", ".........", ".l.l.l.l.", "........."] },
  { goal: "ingredients", need: 4, moves: 46, colors: 6, mask: M.cross, layout: ["#########", "#########", "...fff...", ".........", ".........", ".........", "...fff...", "#########", "#########"].map(r => r.replace(/#/g, ".")) },
